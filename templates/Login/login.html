<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | CNC Maintenance</title>
    <style>
        #login-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: #0f172a;
            font-family: Arial, sans-serif;
        }
        #login-card {
            width: min(100%, 420px);
            padding: 36px;
            box-sizing: border-box;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 24px 60px #02061766;
        }
        #login-heading { margin: 0; font-size: 28px; }
        #login-subtitle { margin: 8px 0 28px; color: #64748b; }
        #login-form { display: grid; gap: 12px; }
        #login-form label { font-size: 14px; font-weight: 700; }
        #login-form input {
            width: 100%;
            padding: 12px 13px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
        }
        #login-form input:focus { outline: 2px solid #3b82f6; border-color: #3b82f6; }
        #login-button {
            margin-top: 10px;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        #login-button:hover { background: #1d4ed8; }
        #login-error {
            padding: 10px 12px;
            border-radius: 8px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 14px;
        }
        #login-brand { margin-bottom: 20px; color: #2563eb; font-weight: 800; }
    </style>
</head>
<body id="login-page">
    <main id="login-card">
        <div id="login-brand">CNC MAINTENANCE</div>
        <h1 id="login-heading">Welcome back</h1>
        <p id="login-subtitle">Sign in to access the maintenance system.</p>
        {% if error %}
            <div id="login-error" role="alert">{{ error }}</div>
        {% endif %}
        <form id="login-form" method="post">
            {% csrf_token %}
            <label for="username">User</label>
            <input id="username" name="username" type="text" value="admin" autocomplete="username" required autofocus>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button id="login-button" type="submit">Login</button>
        </form>
    </main>
</body>
</html>
